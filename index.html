<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ブロックフォール 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Luckiest+Guy&display=swap">
<style>
/* Dark game shell — 3D canvas is the hero, quiet dark cards hold the HUD. Cyan accent + red for bombs. */
:root {
  --bg: #070a14;
  --bg-glow: #141c3a;
  --surface: #10172a;
  --surface-elev: #1a2340;
  --border: #27314d;
  --text: #e6ebf5;
  --text-dim: #7983a0;
  --accent: #5ee3ff;
  --accent-glow: rgba(94, 227, 255, 0.25);
  --danger: #ff5030;
  --font-ui: 'Chakra Petch', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { box-sizing: border-box; }   /* padding inside the 100% height, so the layout never overflows the screen */
body {
  background: radial-gradient(ellipse at 50% 0%, var(--bg-glow) 0%, var(--bg) 55%);
  color: var(--text);
  font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg);
}

.app {
  display: flex; gap: 20px; align-items: stretch;
  width: 100%; max-width: 880px;
  height: 100%; max-height: 760px; min-height: 0;
}

.stage {
  position: relative; flex: 1 1 auto;
  background: #0b1020;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden; min-width: 0;
  box-shadow: 0 0 60px -10px var(--accent-glow), inset 0 0 0 1px rgba(94, 227, 255, 0.05);
}
#game-canvas { display: block; width: 100%; height: 100%; }

/* Screen = any full-stage overlay (title / pause / game over) */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; padding: 24px; text-align: center; z-index: 5;
}
.screen[hidden] { display: none; }
/* Any element toggled with the hidden attribute must really disappear (sidebar etc. use display:flex) */
[hidden] { display: none !important; }

/* Title screen — illustrated background with mode cards pinned to the lower area */
.title-screen {
  background:
    linear-gradient(to top, rgba(7, 10, 20, 0.92) 0%, rgba(7, 10, 20, 0.55) 28%, rgba(7, 10, 20, 0.0) 55%),
    url('title-bg.jpg') center top / cover no-repeat #070a14;
  justify-content: flex-end;
  padding: 24px 20px 32px;
  gap: 0;
}
.title-screen-inner {
  display: flex; flex-direction: column; align-items: center;
  gap: 14px; width: 100%;
}
.mode-grid {
  display: grid; grid-template-columns: 1fr;
  gap: 10px; width: 100%; max-width: 260px;
}
/* Arcade-neon mode cards — match the glowing block aesthetic of the hero image */
.mode-card {
  display: flex; flex-direction: column; align-items: flex-start;
  gap: 6px; padding: 16px 20px;
  background: linear-gradient(180deg, rgba(12, 24, 52, 0.78) 0%, rgba(5, 10, 24, 0.82) 100%);
  border: 1.5px solid rgba(94, 227, 255, 0.5);
  border-radius: 8px;
  color: var(--text); cursor: pointer;
  font-family: var(--font-ui); text-align: left;
  transition: transform 0.18s ease, border-color 0.2s ease, box-shadow 0.25s ease, background 0.2s ease;
  position: relative;
  box-shadow:
    0 0 20px rgba(94, 227, 255, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
.mode-card:hover {
  transform: translateY(-3px);
  border-color: rgba(94, 227, 255, 0.95);
  background: linear-gradient(180deg, rgba(20, 42, 82, 0.88) 0%, rgba(8, 16, 36, 0.88) 100%);
  box-shadow:
    0 0 36px rgba(94, 227, 255, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.mode-card .mode-tag {
  font-family: var(--font-mono); font-size: 10px;
  color: rgba(140, 230, 255, 0.95);
  letter-spacing: 0.25em;
  padding: 2px 7px;
  background: rgba(94, 227, 255, 0.1);
  border: 1px solid rgba(94, 227, 255, 0.35);
  border-radius: 3px;
}
.mode-card .mode-label {
  margin-top: 4px;
  font-size: 23px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: #ffffff;
  text-shadow: 0 0 10px rgba(94, 227, 255, 0.75), 0 0 3px rgba(94, 227, 255, 0.5);
}
.mode-card .mode-desc {
  font-size: 11px;
  color: rgba(190, 210, 240, 0.75);
  letter-spacing: 0.03em;
}

/* Hyper — red/orange neon to echo the explosion sparks */
.mode-card-hyper {
  border-color: rgba(255, 80, 48, 0.5);
  box-shadow:
    0 0 20px rgba(255, 80, 48, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
.mode-card-hyper:hover {
  border-color: rgba(255, 110, 70, 0.95);
  background: linear-gradient(180deg, rgba(60, 20, 15, 0.88) 0%, rgba(22, 8, 10, 0.88) 100%);
  box-shadow:
    0 0 36px rgba(255, 80, 48, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.mode-card-hyper .mode-tag {
  color: rgba(255, 160, 115, 0.95);
  background: rgba(255, 80, 48, 0.12);
  border-color: rgba(255, 80, 48, 0.4);
}
.mode-card-hyper .mode-label {
  color: #ffe0d0;
  text-shadow: 0 0 10px rgba(255, 80, 48, 0.85), 0 0 3px rgba(255, 80, 48, 0.65);
}
.mode-card-hyper::after {
  content: ""; position: absolute; top: 14px; right: 14px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 12px var(--danger), 0 0 24px rgba(255, 80, 48, 0.6);
  animation: bomb-blink 1.4s ease-in-out infinite;
}
@keyframes bomb-blink {
  0%, 100% { opacity: 0.55; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.2); }
}
.chosen-mode {
  margin: 0 0 2px;
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--accent);
  padding: 4px 12px; border-radius: 999px;
  background: rgba(10, 15, 30, 0.65);
  border: 1px solid rgba(94, 227, 255, 0.3);
}
.chosen-mode.hyper {
  color: var(--danger);
  border-color: rgba(255, 80, 48, 0.4);
}
/* Difficulty Hard — amber neon */
.diff-hard {
  border-color: rgba(255, 158, 61, 0.5);
  box-shadow:
    0 0 20px rgba(255, 158, 61, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
.diff-hard:hover {
  border-color: rgba(255, 180, 90, 0.95);
  background: linear-gradient(180deg, rgba(55, 32, 10, 0.88) 0%, rgba(22, 14, 6, 0.88) 100%);
  box-shadow:
    0 0 36px rgba(255, 158, 61, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.diff-hard .mode-tag {
  color: rgba(255, 200, 130, 0.95);
  background: rgba(255, 158, 61, 0.12);
  border-color: rgba(255, 158, 61, 0.4);
}
.diff-hard .mode-label {
  color: #ffe8c6;
  text-shadow: 0 0 10px rgba(255, 158, 61, 0.85), 0 0 3px rgba(255, 158, 61, 0.65);
}
.title-hint {
  margin: 0; color: var(--text-dim); font-size: 11px;
  font-family: var(--font-mono); letter-spacing: 0.08em;
}
.title-hint kbd {
  background: var(--surface-elev); border: 1px solid var(--border);
  border-radius: 3px; padding: 2px 6px;
  color: var(--text); font-size: 10px; margin: 0 2px;
}

/* Pause / game over overlay */
.overlay { background: rgba(7, 10, 20, 0.84); }
.overlay h2 {
  margin: 0; font-size: 30px; font-weight: 600;
  letter-spacing: 0.08em; color: var(--accent);
  text-transform: uppercase;
  text-shadow: 0 0 24px var(--accent-glow);
}
.overlay > p { margin: 0; color: var(--text-dim); font-size: 14px; }
.overlay .mode-chip {
  display: inline-block;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--text-dim);
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--border);
  margin-bottom: 2px;
}
.overlay .mode-chip.hyper { color: var(--danger); border-color: rgba(255, 80, 48, 0.4); }
.overlay-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.overlay button {
  background: var(--accent); color: #07101a;
  border: none; padding: 12px 28px; border-radius: 6px;
  font-family: var(--font-ui); font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  font-size: 13px; cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.2s ease;
  box-shadow: 0 0 24px var(--accent-glow);
}
.overlay button:hover { transform: translateY(-1px); box-shadow: 0 0 32px var(--accent-glow); }
.overlay button:active { transform: translateY(0); }
.overlay button.btn-ghost {
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border);
  box-shadow: none; padding: 12px 18px;
}
.overlay button.btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: transparent; box-shadow: none; }

/* Combo pop-up: chunky cartoon font, every letter a different candy colour, bouncy entrance */
.combo-pop {
  position: absolute; left: 50%; top: 28%; z-index: 4;
  transform: translate(-50%, -50%);
  pointer-events: none; text-align: center; line-height: 0.9;
  font-family: 'Luckiest Guy', 'Chakra Petch', cursive;
  opacity: 0; white-space: nowrap;
}
.combo-pop.show { animation: combo-pop 1.25s cubic-bezier(.2,.9,.3,1.2) forwards; }
.combo-pop .num  { display: block; font-size: clamp(56px, 13vmin, 96px); }
.combo-pop .word { display: block; font-size: clamp(26px, 6vmin, 44px); letter-spacing: 0.06em; margin-top: 2px; }
.combo-pop .ch {
  display: inline-block;
  -webkit-text-stroke: 0.07em #1b0f3a; paint-order: stroke fill;
  text-shadow: 0 0.07em 0 #1b0f3a, 0 0 0.35em currentColor;
}
.combo-pop.show .ch { animation: combo-bounce 0.5s cubic-bezier(.3,1.8,.5,1) both; }
@keyframes combo-pop {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-8deg); }
  18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(4deg); }
  30%  { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
  75%  { opacity: 1; transform: translate(-50%, -55%) scale(1) rotate(0deg); }
  100% { opacity: 0; transform: translate(-50%, -80%) scale(0.9); }
}
@keyframes combo-bounce {
  0%   { transform: translateY(0.5em) scale(0.4); }
  100% { transform: translateY(0) scale(1); }
}

/* Board column: score/level bar on top, board, pause button underneath */
.play-col {
  display: flex; flex-direction: column; gap: 10px;
  flex: 1 1 auto; min-width: 0; min-height: 0;
}
.play-col .stage { flex: 1 1 auto; min-height: 0; }
.hud-top { display: flex; gap: 10px; }
.hud-top .card {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 8px 14px;
}
.hud-top .card-label { margin: 0; }
.hud-bottom { justify-content: center; }
/* Half the board column's width, centred */
.btn-row.hud-bottom button { flex: 0 0 50%; padding: 11px 4px; }

.sidebar {
  display: flex; flex-direction: column; gap: 10px;
  min-width: 180px; width: 180px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
}
.mode-indicator {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.mode-indicator .mode-indicator-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.18em; color: var(--text-dim);
  font-weight: 500;
}
.mode-indicator .mode-indicator-value {
  font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent);
}
.mode-indicator.hyper { border-color: rgba(255, 80, 48, 0.35); }
.mode-indicator.hyper .mode-indicator-value { color: var(--danger); }

.card-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.18em; color: var(--text-dim);
  margin: 0 0 2px; font-weight: 500;
}
.card-value {
  font-family: var(--font-mono); font-size: 22px;
  font-weight: 500; margin: 0; color: var(--text);
  font-variant-numeric: tabular-nums;
}
.next-card { padding: 10px 14px 12px; }
#next-canvas {
  display: block; width: 100%; height: 90px;
  background: var(--surface-elev); border-radius: 6px;
  margin-top: 6px;
}

.btn-row { display: flex; gap: 6px; }
.btn-row button {
  flex: 1; background: transparent; color: var(--text);
  border: 1px solid var(--border); padding: 9px 4px;
  border-radius: 6px; font-family: var(--font-ui);
  font-size: 11px; cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.1em;
  font-weight: 500; transition: all 0.15s ease;
}
.btn-row button:hover { background: var(--surface-elev); border-color: var(--accent); color: var(--accent); }

.help {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-dim); line-height: 2; margin: 0;
}
.help kbd {
  background: var(--surface-elev);
  border: 1px solid var(--border); border-radius: 3px;
  padding: 1px 6px; color: var(--text);
  font-size: 10px;
}
.help .bomb-mark {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: var(--danger);
  box-shadow: 0 0 6px var(--danger);
  vertical-align: middle; margin-right: 4px;
}

/* Touch gesture hint — only shown on phones */
.touch-help {
  display: none; margin: 0;
  font-family: var(--font-ui); font-size: 10px;
  line-height: 1.7; color: var(--text-dim);
}

/* Globally kill text selection + tap highlights on interactive game chrome */
.mode-card, .btn-row button, .overlay button {
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}

/* PC layout: board on the left; Score, Level, Next and Pause stacked in the right column.
   The board column's wrapper "dissolves" (display: contents) so its pieces can sit in the grid. */
@media (min-width: 641px) {
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 180px;
    grid-template-rows: auto auto auto 1fr;
    gap: 10px 20px;
  }
  .play-col { display: contents; }
  .play-col .stage { grid-column: 1; grid-row: 1 / -1; }
  .app.no-hud .play-col .stage { grid-column: 1 / -1; }   /* title screens: board area uses full width */
  .hud-top { grid-column: 2; grid-row: 1; flex-direction: column; gap: 10px; }
  .hud-top .card { display: block; padding: 10px 14px; }
  .hud-top .card-label { margin: 0 0 2px; }
  .sidebar { grid-column: 2; grid-row: 2; width: auto; min-width: 0; }
  .btn-row.hud-bottom { grid-column: 2; grid-row: 3; }
  .btn-row.hud-bottom button { flex: 1 1 auto; padding: 9px 4px; }
}

@media (max-width: 640px) {
  .play-col { gap: 6px; }
  .hud-top { gap: 6px; }
  .hud-top .card { padding: 5px 10px; border-radius: 8px; }
  .hud-top .card-value { font-size: 16px; }
  .btn-row.hud-bottom { flex-direction: row; }
  .btn-row.hud-bottom button { flex: 0 0 50%; padding: 10px 4px; }
  html, body { overscroll-behavior: none; }     /* no pull-to-refresh */
  body { padding-block: 8px; }
  body { padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  #game-canvas { touch-action: none; }          /* no scroll/zoom on the board */
  /* Board on the left, compact info column on the right */
  .app { flex-direction: row; max-height: none; height: 100%; gap: 8px; }
  .stage { flex: 1 1 auto; touch-action: none; }
  .sidebar { flex-direction: column; min-width: 84px; width: 84px; gap: 6px; }
  .sidebar .card { padding: 6px 8px; border-radius: 8px; }
  .sidebar .card-label { font-size: 9px; letter-spacing: 0.12em; }
  .sidebar .card-value { font-size: 16px; overflow: hidden; text-overflow: ellipsis; }
  .sidebar .mode-indicator { flex-direction: column; align-items: flex-start; gap: 2px; padding: 6px 8px; border-radius: 8px; }
  .sidebar .mode-indicator .mode-indicator-label { font-size: 9px; }
  .sidebar .mode-indicator .mode-indicator-value { font-size: 10px; letter-spacing: 0.04em; }
  .sidebar .next-card { padding: 6px 8px 8px; }
  #next-canvas { height: 60px; margin-top: 4px; }
  .btn-row { flex-direction: column; }
  .btn-row button { padding: 12px 4px; font-size: 11px; }
  .help { display: none; }
  .touch-help { display: block; margin-top: auto; }
  .title-main { font-size: 52px; }
  .mode-grid { grid-template-columns: 1fr; width: 100%; max-width: 260px; }
  .mode-card { padding: 14px; }
  .overlay h2 { font-size: 24px; }
}
</style>

<div class="app no-hud">
  <div class="play-col">
  <!-- Score / Level bar above the board -->
  <div class="hud-top" id="hud-top" hidden>
    <div class="card"><p class="card-label">Score</p><p class="card-value" id="score">0</p></div>
    <div class="card"><p class="card-label">Level</p><p class="card-value" id="level">1</p></div>
  </div>
  <div class="stage" id="stage">
    <div class="combo-pop" id="combo-pop" aria-live="polite"></div>
    <canvas id="game-canvas"></canvas>

    <div class="screen title-screen" id="title-screen">
      <div class="title-screen-inner">
        <div class="mode-grid">
          <button class="mode-card" data-mode="normal">
            <span class="mode-tag">01</span>
            <span class="mode-label">Normal</span>
            <span class="mode-desc">クラシックルール</span>
          </button>
          <button class="mode-card mode-card-hyper" data-mode="hyper">
            <span class="mode-tag">02</span>
            <span class="mode-label">Hyper</span>
            <span class="mode-desc">爆弾ブロック入り</span>
          </button>
        </div>
        <p class="title-hint"><kbd>1</kbd><kbd>2</kbd> キーで選択</p>
      </div>
    </div>

    <div class="screen title-screen difficulty-screen" id="difficulty-screen" hidden>
      <div class="title-screen-inner">
        <p class="chosen-mode" id="chosen-mode">Mode : Normal</p>
        <div class="mode-grid">
          <button class="mode-card diff-card" data-difficulty="easy">
            <span class="mode-tag">01</span>
            <span class="mode-label">Easy</span>
            <span class="mode-desc">5種類のブロック</span>
          </button>
          <button class="mode-card diff-card" data-difficulty="normal">
            <span class="mode-tag">02</span>
            <span class="mode-label">Normal</span>
            <span class="mode-desc">テトロミノ全7種類</span>
          </button>
          <button class="mode-card diff-card diff-hard" data-difficulty="hard">
            <span class="mode-tag">03</span>
            <span class="mode-label">Hard</span>
            <span class="mode-desc">11種類(+ ペントミノ4種)</span>
          </button>
        </div>
        <p class="title-hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 選択 · <kbd>Esc</kbd> 戻る</p>
      </div>
    </div>

    <div class="screen overlay" id="overlay" hidden>
      <span class="mode-chip" id="ov-mode" hidden></span>
      <h2 id="ov-title"></h2>
      <p id="ov-text"></p>
      <div class="overlay-actions">
        <button id="ov-btn">再開</button>
        <button id="ov-reset" class="btn-ghost" hidden>リセット</button>
        <button id="ov-back" class="btn-ghost" hidden>タイトルへ</button>
      </div>
    </div>
  </div>
  <!-- Pause button under the board -->
  <div class="btn-row hud-bottom" id="hud-bottom" hidden>
    <button id="pause-btn">Pause</button>
  </div>
  </div>

  <aside class="sidebar" id="sidebar" hidden>
    <div class="card next-card"><p class="card-label">Next</p><canvas id="next-canvas"></canvas></div>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
